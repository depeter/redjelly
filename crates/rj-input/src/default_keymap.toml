# Default keymap (SPEC §4). User overrides go in keymap.toml with the same
# layout; a key bound there replaces the default for that context.
# Values: an action name, optionally with an argument ("seek:-5").

[global]
"F" = "toggle_fullscreen"
"Alt+Enter" = "toggle_fullscreen"
"?" = "show_keymap"
"Ctrl+Q" = "quit"
"Pad.Back" = "show_stats"

[browse]
"Up" = "nav_up"
"Down" = "nav_down"
"Left" = "nav_left"
"Right" = "nav_right"
"Enter" = "activate"
"Esc" = "back"
"Backspace" = "back"
"Tab" = "next_region"
"Shift+Tab" = "prev_region"
"Ctrl+F" = "search"
"Ctrl+H" = "go_home"
"Ctrl+U" = "switch_user"
"Ctrl+J" = "jobs"
"Ctrl+S" = "settings"
"Ctrl+O" = "settings"
"Menu" = "context_menu"
"Pad.DPadUp" = "nav_up"
"Pad.DPadDown" = "nav_down"
"Pad.DPadLeft" = "nav_left"
"Pad.DPadRight" = "nav_right"
"Pad.South" = "activate"
"Pad.East" = "back"
"Pad.North" = "context_menu"

[dialog]
"Up" = "nav_up"
"Down" = "nav_down"
"Left" = "nav_left"
"Right" = "nav_right"
"Enter" = "activate"
"Esc" = "back"
"Pad.DPadUp" = "nav_up"
"Pad.DPadDown" = "nav_down"
"Pad.DPadLeft" = "nav_left"
"Pad.DPadRight" = "nav_right"
"Pad.South" = "activate"
"Pad.East" = "back"

[player]
"Space" = "play_pause"
"K" = "play_pause"
"Left" = "seek:-5"
"Right" = "seek:5"
"Ctrl+Left" = "seek:-60"
"Ctrl+Right" = "seek:60"
"Shift+Left" = "seek_exact:-1"
"Shift+Right" = "seek_exact:1"
"," = "frame_back"
"." = "frame_step"
"Up" = "volume:5"
"Down" = "volume:-5"
"M" = "mute"
"PageUp" = "chapter:-1"
"PageDown" = "chapter:1"
"N" = "next_episode"
"P" = "previous_episode"
"[" = "speed:-0.1"
"]" = "speed:0.1"
"Shift+Backspace" = "speed_reset"
"A" = "cycle_audio"
"J" = "cycle_subtitle"
"Shift+J" = "cycle_subtitle_back"
"V" = "toggle_subtitles"
"S" = "subtitle_panel"
"Z" = "sub_delay:-100"
"X" = "sub_delay:100"
"Shift+Z" = "sub_delay:-1000"
"Shift+X" = "sub_delay:1000"
"Ctrl+Z" = "sub_auto_sync"
# Enter / A: skip intro if offered, else show the controls (then press the
# focused button; the arrows move between buttons while they have focus).
"Enter" = "activate"
"I" = "show_stats"
"Esc" = "back"
"Backspace" = "back"
"Ctrl+S" = "cycle_shader"
"Ctrl+T" = "cycle_tone_mapping"
"Ctrl+P" = "cycle_picture_quality"
"0" = "seek_percent:0"
"1" = "seek_percent:10"
"2" = "seek_percent:20"
"3" = "seek_percent:30"
"4" = "seek_percent:40"
"5" = "seek_percent:50"
"6" = "seek_percent:60"
"7" = "seek_percent:70"
"8" = "seek_percent:80"
"9" = "seek_percent:90"
"MediaPlayPause" = "play_pause"
"MediaNext" = "next_episode"
"MediaPrevious" = "previous_episode"
"MediaStop" = "stop"
"Pad.South" = "activate"
"Pad.East" = "back"
"Pad.West" = "cycle_audio"
"Pad.North" = "subtitle_panel"
"Pad.LeftShoulder" = "seek:-10"
"Pad.RightShoulder" = "seek:10"
"Pad.LeftTrigger" = "seek:-60"
"Pad.RightTrigger" = "seek:60"
"Pad.DPadUp" = "volume:5"
"Pad.DPadDown" = "volume:-5"
"Pad.DPadLeft" = "seek:-10"
"Pad.DPadRight" = "seek:10"
"Pad.Start" = "play_pause"

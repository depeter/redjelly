[workspace]
resolver = "3"
members = ["app", "crates/*"]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
rj-core = { path = "crates/rj-core" }
rj-jellyfin = { path = "crates/rj-jellyfin" }
rj-player = { path = "crates/rj-player" }
rj-subs = { path = "crates/rj-subs" }
rj-ai = { path = "crates/rj-ai" }
rj-input = { path = "crates/rj-input" }
rj-seerr = { path = "crates/rj-seerr" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
async-trait = "0.1"
